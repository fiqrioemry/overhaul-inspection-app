services:
  app:
    build: .
    container_name: overhaul
    restart: unless-stopped

    env_file:
      - .env.production
    ports:
      - "${APP_PORT}:${APP_PORT}"
    expose:
      - "${APP_PORT}"

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT}/api/v1/health || exit 1"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 15s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${APP_NAME}.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}.tls.certresolver=cloudflare"
      - "traefik.http.services.${APP_NAME}.loadbalancer.server.port=${APP_PORT}"
      - "traefik.http.services.${APP_NAME}.loadbalancer.server.scheme=http"
      # Only the forwarded-proto hint. The previous 'ws-headers' middleware also stamped
      # Connection: keep-alive, Upgrade and Upgrade: websocket onto *every* request, which
      # made Traefik treat each one as a WebSocket upgrade candidate. Harmless for the
      # length-delimited JSON responses that make up the rest of the API, but it broke the
      # one binary endpoint (GET /daily-reports/:id/attachments/download) — the origin never
      # produced a valid response and Cloudflare returned a header-less 502, which the browser
      # reports as a CORS failure. Nothing here serves WebSockets: src/lib/socket.ts is not
      # imported anywhere, so the upgrade headers had no purpose.
      - "traefik.http.routers.${APP_NAME}.middlewares=forwarded-proto"
      - "traefik.http.middlewares.forwarded-proto.headers.customrequestheaders.X-Forwarded-Proto=https"

    networks:
      - shared-net

networks:
  shared-net:
    external: true
